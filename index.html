<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechWave - Podcast Website</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Custom gradient for Subscribe button */
        .gradient-btn {
            background: linear-gradient(60deg, #F7E93F 0%, #FB09B4 51%, #9100F8 100%);
        }

        .gradient-btn:hover {
            background: linear-gradient(90deg, #E6005F 0%, #FF4A8D 100%);
        }

        /* TechWave logo gradient */
        .logo-gradient {
            background: linear-gradient(180deg, #F7E93F 0%, #FB09B4 51%, #9100F8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>

<body class="bg-[#1A0B2E] text-white font-sans">

    <!-- Navbar Section -->
    <nav class="py-6">
        <div class="max-w-7xl mx-auto px-6 flex justify-between items-center">

            <!-- Logo with Gradient -->
            <div class="text-2xl font-bold">
                Tech<span class="logo-gradient">Wave</span>
            </div>

            <!-- Menu Items (Hidden on Mobile) -->
            <ul class="hidden lg:flex gap-12 text-base">
                <li><a href="#" class="hover:text-[#FF1A75] transition">About</a></li>
                <li><a href="#" class="hover:text-[#FF1A75] transition">Episodes</a></li>
                <li><a href="#" class="hover:text-[#FF1A75] transition">Host</a></li>
            </ul>

            <!-- Subscribe Button (Hidden on Mobile) -->
            <button class="hidden lg:block gradient-btn text-white px-6 py-3 rounded-full font-semibold transition">
                Subscribe
            </button>

            <!-- Hamburger Menu Icon (Visible on Mobile) -->
            <div class="lg:hidden">
                <img src="assets/hamburger-menu.png" alt="Menu" class="w-8 h-8 cursor-pointer">
            </div>

        </div>
    </nav>

    <!-- Banner Section -->
    <section class="relative py-20 overflow-hidden">
        <!-- Background Image -->
        <div class="absolute inset-0 z-0">
            <img src="assets/hero-bg.png" alt="Hero Background" class="w-full h-full object-cover opacity-50">
        </div>

        <div class="max-w-7xl mx-auto px-6 relative z-10">
            <!-- Banner Content -->
            <div class="text-center">

                <!-- Podcast Circle with Microphone and NEW Badge -->
                <div class="relative inline-block mb-8">
                    <!-- Hero Circle (Gradient Circle) -->
                    <div class="relative w-64 h-64 md:w-80 md:h-80 lg:w-96 lg:h-96 mx-auto">
                        <img src="assets/hero-circle.png" alt="Podcast Circle" class="w-full h-full">

                        <!-- Microphone Inside Circle (Width: 116.67px, Height: 175px ratio) -->
                        <img src="assets/microphone.png" alt="Microphone"
                            class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-[70px] h-[105px] md:w-[90px] md:h-[135px] lg:w-[117px] lg:h-[175px]">
                    </div>

                    <!-- NEW Badge -->
                    <div
                        class="absolute top-0 right-0 md:top-4 md:right-4 lg:top-8 lg:right-8 bg-[#00FF88] text-black px-4 py-1 rounded-full text-sm font-bold">
                        NEW
                    </div>
                </div>

                <!-- Heading -->
                <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold mb-4">
                    TechWave
                </h1>

                <!-- Description -->
                <p class="text-gray-300 text-base md:text-lg max-w-2xl mx-auto mb-8">
                    Your daily dose of tech insights, productivity hacks, and personal growth.
                </p>

                <!-- Two Buttons -->
                <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
                    <button
                        class="gradient-btn text-white px-8 py-4 rounded-full font-semibold transition w-full sm:w-auto">
                        Listen On Spotify
                    </button>
                    <button
                        class="bg-transparent border-2 border-[#00FF88] text-[#00FF88] px-8 py-4 rounded-full font-semibold hover:bg-[#00FF88] hover:text-black transition w-full sm:w-auto">
                        Subscribe
                    </button>
                </div>

            </div>
        </div>
    </section>

</body>

</html>
